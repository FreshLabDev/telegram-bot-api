# SPDX-License-Identifier: Apache-2.0
name: build

on:
  push:
    # dev builds the image to prove the Dockerfile still works, but only main
    # publishes: the version tag must not move to a build nobody released.
    branches: [main, dev]
    paths: [Dockerfile, entrypoint.sh, .github/workflows/build.yml]
  pull_request:
    paths: [Dockerfile, entrypoint.sh, .github/workflows/build.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/freshlabdev/telegram-bot-api

jobs:
  build:
    runs-on: ubuntu-latest
    # TDLib takes a while; the default 6h limit is plenty, this keeps a hung
    # build from sitting there.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint the entrypoint
        run: sh -n entrypoint.sh

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Decide whether this run publishes
        id: publish
        run: |
          if [ "${{ github.event_name }}" != pull_request ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.publish.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the pinned version out of the Dockerfile
        id: pin
        run: |
          version=$(grep -oE 'ARG EXPECTED_BOT_API=[0-9]+\.[0-9]+' Dockerfile | cut -d= -f2)
          commit=$(grep -oE 'ARG BOT_API_COMMIT=[0-9a-f]{40}' Dockerfile | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Bot API $version from tdlib/telegram-bot-api@$commit" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.publish.outputs.push == 'true' }}
          # An unpublished build is loaded locally so the version check below
          # still has something to run.
          load: ${{ steps.publish.outputs.push != 'true' }}
          # The build fetches upstream sources, so a cached layer would hide a
          # changed pin. Layers are cached by the ARG values, which is exactly
          # the granularity we want.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:${{ steps.pin.outputs.version }}
            ${{ env.IMAGE }}:commit-${{ steps.pin.outputs.commit }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          # Attestations need a registry to live in; a loaded image has none.
          provenance: ${{ steps.publish.outputs.push == 'true' }}
          sbom: ${{ steps.publish.outputs.push == 'true' }}

      - name: Report the digest to pin
        if: steps.publish.outputs.push == 'true'
        run: |
          echo "Pin this in compose:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the built server reports the pinned version
        run: |
          if [ "${{ steps.publish.outputs.push }}" = true ]; then
            ref="${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"
          else
            ref="${{ env.IMAGE }}:sha-${{ github.sha }}"
          fi
          # --version goes to stderr: the server logs it through its own
          # logger, which never writes to stdout.
          got=$(docker run --rm --entrypoint telegram-bot-api "$ref" --version 2>&1)
          echo "$got"
          case "$got" in
            *"${{ steps.pin.outputs.version }}"*) ;;
            *) echo "built server reports '$got', expected Bot API ${{ steps.pin.outputs.version }}"; exit 1 ;;
          esac
