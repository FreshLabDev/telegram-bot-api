# SPDX-License-Identifier: Apache-2.0
# Names a build that build.yml already pushed and verified. It does not rebuild:
# a rebuild from the same sources is not guaranteed to produce the same bytes,
# and the point of a release is to name bytes that were tested. See
# docs/versioning.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/freshlabdev/telegram-bot-api

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the tag commit on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "tag ${GITHUB_REF_NAME} is not an ancestor of origin/main"
            exit 1
          fi

      - name: The tag's Bot API version must be the one pinned here
        id: pin
        run: |
          pinned=$(grep -oE 'ARG EXPECTED_BOT_API=[0-9]+\.[0-9]+' Dockerfile | cut -d= -f2)
          # v10.3-1 -> 10.3
          tagged=$(printf '%s' "${GITHUB_REF_NAME}" | sed -E 's/^v([0-9]+\.[0-9]+)-[0-9]+$/\1/')
          if [ "${tagged}" = "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} is not of the form v<bot api>-<build>"
            exit 1
          fi
          if [ "${tagged}" != "${pinned}" ]; then
            echo "tag says Bot API ${tagged}, the Dockerfile pins ${pinned}"
            exit 1
          fi
          echo "version=${pinned}" >> "$GITHUB_OUTPUT"

      - name: Require a changelog section for this tag
        id: changelog
        run: |
          notes_file="$(mktemp)"
          awk -v ver="## ${GITHUB_REF_NAME}" '
            index($0, ver) == 1 && (length($0) == length(ver) || substr($0, length(ver) + 1, 1) == " ") { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md >"${notes_file}"
          if [ ! -s "${notes_file}" ]; then
            echo "CHANGELOG.md has no '## ${GITHUB_REF_NAME}' section"
            exit 1
          fi
          echo "file=${notes_file}" >>"$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Resolve the digest behind the pinned version tag
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect \
            "${IMAGE}:${{ steps.pin.outputs.version }}" --format '{{ json .Manifest.Digest }}' \
            | tr -d '"')
          if [ -z "${digest}" ]; then
            echo "no image at ${IMAGE}:${{ steps.pin.outputs.version }} -- run the build workflow first"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Confirm that image still reports the pinned version
        run: |
          # --version goes to stderr: the server logs through its own logger,
          # which never writes to stdout.
          got=$(docker run --rm --entrypoint telegram-bot-api \
            "${IMAGE}@${{ steps.digest.outputs.digest }}" --version 2>&1)
          echo "$got"
          case "$got" in
            *"${{ steps.pin.outputs.version }}"*) ;;
            *) echo "image reports '$got', expected Bot API ${{ steps.pin.outputs.version }}"; exit 1 ;;
          esac

      - name: Add the release tag to that same digest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${GITHUB_REF_NAME}" \
            "${IMAGE}@${{ steps.digest.outputs.digest }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="$(mktemp)"
          cat "${{ steps.changelog.outputs.file }}" > "${notes}"
          {
            echo
            echo '## Deploy'
            echo
            echo 'Pin the digest, not the tag:'
            echo
            echo '```'
            echo "BOT_API_IMAGE=${IMAGE}@${{ steps.digest.outputs.digest }}"
            echo '```'
          } >> "${notes}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${notes}"
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${notes}"
          fi
