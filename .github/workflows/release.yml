# SPDX-License-Identifier: Apache-2.0
# Names a build that build.yml already pushed and verified. It does not rebuild:
# a rebuild from the same sources is not guaranteed to produce the same bytes,
# and the point of a release is to name bytes that were tested. See
# docs/versioning.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/freshlabdev/telegram-bot-api

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the tag on the branch its channel is published from
        # docs/versioning.md: pre-releases are tagged on dev, stable releases on
        # main. A stable tag that never went through main would publish
        # something the production branch has not seen.
        run: |
          if printf '%s' "${GITHUB_REF_NAME}" | grep -Eq -- '-(alpha|beta|rc)\.'; then
            branch=dev
          else
            branch=main
          fi
          git fetch --no-tags origin "${branch}:refs/remotes/origin/${branch}"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${branch}"; then
            echo "tag ${GITHUB_REF_NAME} is not an ancestor of origin/${branch}"
            exit 1
          fi

      - name: The tag's Bot API version must be the one pinned here
        id: pin
        run: |
          pinned=$(grep -oE 'ARG EXPECTED_BOT_API=[0-9]+\.[0-9]+' Dockerfile | cut -d= -f2)
          # v10.3-1 -> 10.3
          tagged=$(printf '%s' "${GITHUB_REF_NAME}" | sed -E 's/^v([0-9]+\.[0-9]+)-[0-9]+$/\1/')
          if [ "${tagged}" = "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} is not of the form v<bot api>-<build>"
            exit 1
          fi
          if [ "${tagged}" != "${pinned}" ]; then
            echo "tag says Bot API ${tagged}, the Dockerfile pins ${pinned}"
            exit 1
          fi
          echo "version=${pinned}" >> "$GITHUB_OUTPUT"

      - name: Require a changelog section for this tag
        id: changelog
        run: |
          notes_file="$(mktemp)"
          awk -v ver="## ${GITHUB_REF_NAME}" '
            index($0, ver) == 1 && (length($0) == length(ver) || substr($0, length(ver) + 1, 1) == " ") { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md >"${notes_file}"
          if [ ! -s "${notes_file}" ]; then
            echo "CHANGELOG.md has no '## ${GITHUB_REF_NAME}' section"
            exit 1
          fi
          echo "file=${notes_file}" >>"$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Resolve the digest built from this exact commit
        id: digest
        run: |
          # Addressed by this repository's commit, never by ":10.3". That tag
          # floats -- the build workflow rewrites it on every qualifying push --
          # so resolving it here would publish whatever happened to be behind it
          # at release time, with no connection to the tagged commit. Merging to
          # main changes the Dockerfile and starts a build that takes up to two
          # hours; a tag pushed before it finished would have released the
          # previous image, and the --version check could not tell, because the
          # Bot API version did not change.
          ref="${IMAGE}:sha-${GITHUB_SHA}"
          digest=$(docker buildx imagetools inspect "${ref}" \
            --format '{{ json .Manifest.Digest }}' 2>/dev/null | tr -d '"' || true)
          if [ -z "${digest}" ]; then
            echo "no image built from ${GITHUB_SHA}."
            echo "The build workflow has not finished for this commit -- wait for it, then re-run this release."
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Confirm that image still reports the pinned version
        run: |
          # --version goes to stderr: the server logs through its own logger,
          # which never writes to stdout.
          got=$(docker run --rm --entrypoint telegram-bot-api \
            "${IMAGE}@${{ steps.digest.outputs.digest }}" --version 2>&1)
          echo "$got"
          # Anchored on a word boundary. A bare substring test passes "10.30"
          # for "10.3", and passes any line that merely mentions the number --
          # and this is now the only barrier between a digest in GHCR and a
          # published release tag.
          if ! printf '%s' "$got" | grep -Eq "(^|[^0-9.])${{ steps.pin.outputs.version }}([^0-9.]|$)"; then
            echo "image reports '$got', expected Bot API ${{ steps.pin.outputs.version }}"
            exit 1
          fi

      - name: Add the release tag to that same digest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${GITHUB_REF_NAME}" \
            "${IMAGE}@${{ steps.digest.outputs.digest }}"

          # The build publishes provenance and an SBOM, so the tag points at an
          # OCI index rather than a single manifest, and `create` builds and
          # pushes a new index. The bytes that run are the same either way, but
          # the index digest is not guaranteed to be, and the whole point of this
          # version line is that a release names one digest that can be pinned.
          # If it moved, say so here rather than let a rollback discover it.
          got=$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}" \
            --format '{{ json .Manifest.Digest }}' | tr -d '"')
          if [ "${got}" != "${{ steps.digest.outputs.digest }}" ]; then
            echo "re-tagging moved the digest:"
            echo "  built:  ${{ steps.digest.outputs.digest }}"
            echo "  tagged: ${got}"
            echo "Pin the tagged digest, and do not trust the one in the release notes."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="$(mktemp)"
          cat "${{ steps.changelog.outputs.file }}" > "${notes}"
          {
            echo
            echo '## Deploy'
            echo
            echo 'Pin the digest, not the tag:'
            echo
            echo '```'
            echo "BOT_API_IMAGE=${IMAGE}@${{ steps.digest.outputs.digest }}"
            echo '```'
          } >> "${notes}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${notes}"
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${notes}"
          fi
